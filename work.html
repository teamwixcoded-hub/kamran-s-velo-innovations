<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Work | Kamran’s Velo Innovations</title>
<meta name="description" content="Selected Wix Studio, Velo and integration projects delivered by Kamran’s Velo Innovations.">
<meta name="theme-color" content="#0B0F1A">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<velo-header active="work"></velo-header>

<main id="main">
  <section class="page-hero">
    <div class="container">
      <span class="eyebrow">Work</span>
      <h1>Projects we’ve shipped</h1>
      <p>Real builds for real businesses. Filter by type.</p>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="filters" role="group" aria-label="Filter projects">
        <button class="chip" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="chip" type="button" data-filter="Wix Studio" aria-pressed="false">Wix Studio</button>
        <button class="chip" type="button" data-filter="Velo" aria-pressed="false">Velo</button>
        <button class="chip" type="button" data-filter="Integrations" aria-pressed="false">Integrations</button>
      </div>
      <div class="grid g3" data-render="projects"></div>
    </div>
  </section>

  <velo-cta></velo-cta>
</main>

<velo-footer></velo-footer>
<script src="js/data.js"></script>
